name: inferroute

x-worker: &worker
  build:
    context: .
    dockerfile: Dockerfile.worker
  image: inferroute/worker:dev
  # No restart policy: the chaos benchmark kills and restarts worker-1 itself.
  restart: "no"
  stop_grace_period: 30s
  networks: [inferroute]

services:
  router:
    build:
      context: .
      dockerfile: Dockerfile.router
    image: inferroute/router:dev
    restart: unless-stopped
    stop_grace_period: 20s
    ports: ["8080:8080"]
    environment:
      WORKERS: worker-1:50051,worker-2:50051,worker-3:50051
      MODELS: phi-3-mini=1024,llama-3-8b=2048,mistral-7b=2048,mixtral-8x7b=6144
      RATE_LIMIT_RPS: "100"
      RATE_LIMIT_BURST: "200"
      TENANT_LIMITS: tenant-free=20:40,tenant-pro=200:400,tenant-enterprise=1000:2000
      HEARTBEAT_INTERVAL: 500ms
      UNHEALTHY_AFTER: "2"
      BREAKER_FAILURE_THRESHOLD: "5"
      BREAKER_OPEN_TIMEOUT: 2s
      BREAKER_JITTER: "0.5"
      REQUEST_TIMEOUT: 10s
      ATTEMPT_TIMEOUT: 3s
      QUEUE_TIMEOUT: 1s
    depends_on: [worker-1, worker-2, worker-3]
    networks: [inferroute]

  # Three hardware profiles: small/fast, medium, large/slow. Sized N+1: at the
  # default 200 req/s benchmark load, any two workers can carry the traffic.
  # CONTENTION adds 2% latency per concurrent request (batch interference).
  worker-1:
    <<: *worker
    hostname: worker-1
    ports: ["9101:9091"]
    environment:
      WORKER_ID: worker-1
      TOTAL_VRAM_MB: "24000"
      BASE_LATENCY_MS: "40"
      JITTER_MS: "15"
      PER_TOKEN_MS: "0.3"
      CONTENTION: "0.02"

  worker-2:
    <<: *worker
    hostname: worker-2
    ports: ["9102:9091"]
    environment:
      WORKER_ID: worker-2
      TOTAL_VRAM_MB: "48000"
      BASE_LATENCY_MS: "60"
      JITTER_MS: "25"
      PER_TOKEN_MS: "0.4"
      CONTENTION: "0.02"

  worker-3:
    <<: *worker
    hostname: worker-3
    ports: ["9103:9091"]
    environment:
      WORKER_ID: worker-3
      TOTAL_VRAM_MB: "80000"
      BASE_LATENCY_MS: "90"
      JITTER_MS: "40"
      PER_TOKEN_MS: "0.5"
      CONTENTION: "0.02"

  prometheus:
    image: prom/prometheus:v3.4.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      - --web.enable-lifecycle
    ports: ["9090:9090"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [inferroute]

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/inferroute.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    networks: [inferroute]

  k6:
    image: grafana/k6:1.0.0
    profiles: [bench]
    # Run as the host user so summaries written to ./benchmarks/results are
    # owned by you. `make bench` and chaos.sh export these.
    user: "${BENCH_UID:-0}:${BENCH_GID:-0}"
    environment:
      BASE_URL: http://router:8080
    volumes:
      - ./benchmarks:/bench
    working_dir: /bench
    networks: [inferroute]

networks:
  inferroute: {}
