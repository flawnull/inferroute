version: "2"
run:
  tests: true
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - nilerr
    - unconvert
    - usestdlibvars
    - wastedassign
    - copyloopvar
    - revive
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
  exclusions:
    paths:
      - gen/
formatters:
  enable:
    - gofmt
    - goimports
